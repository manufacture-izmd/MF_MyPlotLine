<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MyPlotLine</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2128;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #7d8590;
  --accent: #f78166;
  --accent-glow: rgba(247,129,102,.35);
  --action-bg: #1c3052;
  --action-bd: #388bfd;
  --label-w: 160px;
  --tl-h: 80px;
  --sec-h: 70px;
  --content-w: 3200px;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 13px; }

#app { height: 100%; display: flex; flex-direction: column; }

/* ── Header ── */
#header { flex-shrink: 0; height: 44px; background: var(--surface);
  border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 14px; }
#header h1 { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .5px; }

#hamburger { position: relative; width: 32px; height: 32px; margin-right: 8px; border: none;
  background: transparent; color: var(--text); font-size: 18px; line-height: 1; cursor: pointer;
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  transition: background .12s; }
#hamburger:hover { background: var(--surface2); }

#menu { position: absolute; top: 40px; left: 10px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 4px 0; min-width: 160px;
  box-shadow: 0 8px 28px rgba(0,0,0,.6); z-index: 9998; display: none; }
#menu.open { display: block; }
#menu > div { padding: 10px 18px; cursor: pointer; color: var(--text); font-size: 13px; }
#menu > div:hover { background: var(--surface2); color: var(--accent); }

/* ── Scroll wrap ── */
#scroll-wrap { flex: 1; overflow: auto; }

/* ── Row ── */
.row { display: flex; align-items: stretch; }

/* ── Label cell (sticky-left) ── */
.row-label { width: var(--label-w); min-width: var(--label-w); flex-shrink: 0;
  position: sticky; left: 0; z-index: 30; background: var(--surface);
  border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 14px; }

/* ── Content cell ── */
.row-content { flex-shrink: 0; width: var(--content-w); position: relative;
  border-bottom: 1px solid var(--border); background: var(--bg); overflow: visible; }

/* ── Timeline row ── */
#timeline-row .row-label { height: var(--tl-h); font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .8px; }
#timeline-row .row-content { height: var(--tl-h); background: var(--surface2); cursor: crosshair;
  touch-action: manipulation; }

#timeline-line { position: absolute; top: 50%; left: 0; right: 0; height: 2px;
  background: var(--border); pointer-events: none; transform: translateY(-50%); }

/* ── Event dot ── */
.ev-dot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
  transform: translate(-50%, -50%); cursor: pointer; z-index: 15;
  touch-action: none; transition: box-shadow .15s, transform .1s; }
.ev-dot:hover { box-shadow: 0 0 0 6px var(--accent-glow); transform: translate(-50%, -50%) scale(1.2); }
.ev-dot.snapping { box-shadow: 0 0 0 7px var(--accent-glow), 0 0 14px var(--accent); transform: translate(-50%, -50%) scale(1.25); }

/* ── Event label ── */
.ev-label { position: absolute; top: 7px; transform: translateX(-50%); z-index: 16; }
.ev-label input { background: transparent; border: none; border-bottom: 1px solid transparent;
  color: var(--text); font-size: 10px; width: 88px; text-align: center; outline: none;
  cursor: default; padding: 1px 3px; }
.ev-label input:focus { cursor: text; border-bottom-color: var(--accent);
  background: rgba(247,129,102,.1); border-radius: 2px 2px 0 0; }

/* ── Event drop line (in timeline row, lower half) ── */
.ev-drop-line { position: absolute; top: calc(50% + 6px); bottom: 0;
  width: 0; border-left: 1.5px dashed rgba(247,129,102,.5);
  transform: translateX(-50%); pointer-events: none; z-index: 5; }

/* ── Section row ── */
.sec-row .row-label { height: var(--sec-h); }
.sec-row .row-content { height: var(--sec-h); cursor: copy; touch-action: manipulation; }

.sec-name-input { background: transparent; border: none; outline: none;
  color: var(--text); font-size: 12px; font-weight: 500; width: 100%; cursor: default; }
.sec-name-input:focus { cursor: text; }

.sec-del-btn { flex-shrink: 0; width: 22px; height: 22px; border: none; background: transparent;
  color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; border-radius: 5px;
  display: flex; align-items: center; justify-content: center; opacity: .35;
  transition: opacity .12s, background .12s, color .12s; }
.row-label:hover .sec-del-btn { opacity: 1; }
.sec-del-btn:hover { background: #6e2424; color: #ffd9d9; opacity: 1; }

/* ── Event drop line in section ── */
.sec-drop-line { position: absolute; top: 0; bottom: 0; width: 0;
  border-left: 1.5px dashed rgba(247,129,102,.3);
  transform: translateX(-50%); pointer-events: none; z-index: 2; }

/* ── Action right-edge drop line (drawn when another action aligns to it) ── */
.action-edge-line { position: absolute; top: 0; bottom: 0; width: 0;
  border-left: 1.5px dashed rgba(56,139,253,.45);
  transform: translateX(-50%); pointer-events: none; z-index: 3; }

/* ── Action bar ── */
.action-bar { position: absolute; top: 50%; transform: translateY(-50%); height: 36px;
  background: var(--action-bg); border: 1.5px solid var(--action-bd); border-radius: 0;
  display: flex; align-items: center; cursor: grab; user-select: none;
  -webkit-user-select: none; -webkit-touch-callout: none; z-index: 10;
  min-width: 50px; touch-action: none; transition: box-shadow .1s, border-color .1s; }
.action-bar:hover { box-shadow: 0 2px 10px rgba(56,139,253,.3); }
.action-bar.dragging { cursor: grabbing; opacity: .88; z-index: 50; }
.action-bar.snapping { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }

/* ── Trapezoid SVG shape (replaces CSS border when fade is active) ── */
.action-shape-svg  { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: -1;
  transition: filter .1s; }
.action-shape-poly { fill: var(--action-bg); stroke: var(--action-bd); stroke-width: 1.5px; }
/* When a fade is active the SVG paints the shape, so suppress the rectangular
   box-shadow and let the glow follow the trapezoid via an SVG drop-shadow. */
.action-bar.has-fade,
.action-bar.has-fade:hover,
.action-bar.has-fade.snapping { box-shadow: none; }
.action-bar.has-fade:hover  .action-shape-svg { filter: drop-shadow(0 2px 8px rgba(56,139,253,.45)); }
.action-bar.snapping .action-shape-poly { stroke: var(--accent); }
.action-bar.has-fade.snapping .action-shape-svg { filter: drop-shadow(0 0 4px var(--accent)); }

/* ── Fade handles ── */
.fade-handle {
  position: absolute; top: 0; width: 8px; height: 8px; border-radius: 50%;
  background: #fff; border: 1.5px solid var(--accent);
  transform: translate(-50%, -50%);
  cursor: ew-resize; z-index: 25; touch-action: none;
  -webkit-user-select: none; user-select: none;
  box-shadow: 0 0 0 2px var(--accent-glow);
  transition: box-shadow .1s;
}
.fade-handle:hover { box-shadow: 0 0 0 4px var(--accent-glow); }
.fade-handle.snapping { box-shadow: 0 0 0 5px var(--accent-glow), 0 0 8px var(--accent); }

/* ── Edge-alignment markers ── */
.action-mark {
  position: absolute; top: -18px;
  color: var(--accent); pointer-events: none; z-index: 20;
  filter: drop-shadow(0 0 4px var(--accent));
  transform: translateX(-50%);
}
.action-mark-l { left: 0; }

.action-text { flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 11px; padding: 0 5px; cursor: default;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.action-text:focus { cursor: text; }

.t-handle { width: 14px; height: 100%; cursor: ew-resize; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.2); font-size: 9px; transition: color .1s; }
.t-handle:hover { color: rgba(255,255,255,.5); }
.t-handle.tl, .t-handle.tr { border-radius: 0; }

/* ── Add section row ── */
#add-sec-row .row-label { height: 52px; border-bottom: none; padding: 8px 14px; }
#add-sec-row .row-content { height: 52px; border-bottom: none; background: transparent; }

.btn-add-section { width: 100%; background: transparent; border: 1px dashed var(--border);
  color: var(--muted); font-size: 11px; padding: 6px 10px; border-radius: 5px; cursor: pointer;
  transition: border-color .15s, color .15s; }
.btn-add-section:hover { border-color: var(--accent); color: var(--accent); }

/* ── Context menu ── */
#ctx { position: fixed; background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: 4px 0; z-index: 9999; box-shadow: 0 8px 28px rgba(0,0,0,.6);
  display: none; min-width: 120px; }
#ctx div { padding: 10px 18px; cursor: pointer; color: var(--text); font-size: 13px; }
#ctx div:hover { background: var(--surface2); color: var(--accent); }

/* ── Build badge ── */
#build { position: fixed; bottom: 8px; right: 12px; font-size: 9px; color: #3d444d;
  pointer-events: none; z-index: 9999; font-family: monospace; letter-spacing: .5px; }

/* ── Modal ── */
#modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6);
  display: none; align-items: center; justify-content: center; z-index: 10000; }
#modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 22px 22px 16px; max-width: 380px; width: calc(100% - 40px);
  box-shadow: 0 14px 48px rgba(0,0,0,.6); }
#modal-msg { font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 20px;
  white-space: pre-wrap; }
#modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
.modal-btn { padding: 8px 18px; border-radius: 6px; font-size: 13px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  transition: background .12s, border-color .12s; }
.modal-btn:hover { background: var(--border); }
.modal-btn.danger { background: #6e2424; border-color: #b94343; color: #ffd9d9; }
.modal-btn.danger:hover { background: #8a2d2d; }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <button id="hamburger" aria-label="メニュー">☰</button>
    <div id="menu">
      <div id="menu-new">新規作成</div>
    </div>
    <h1>MyPlotLine</h1>
  </div>

  <div id="scroll-wrap">
    <!-- Timeline row -->
    <div class="row" id="timeline-row">
      <div class="row-label">イベント</div>
      <div class="row-content" id="tl-content">
        <div id="timeline-line"></div>
      </div>
    </div>
    <!-- Section rows injected by JS -->
    <!-- Add section row -->
    <div class="row" id="add-sec-row">
      <div class="row-label">
        <button class="btn-add-section" id="btn-add-sec">＋ セクション追加</button>
      </div>
      <div class="row-content"></div>
    </div>
  </div>
</div>

<div id="ctx"></div>
<div id="build"></div>

<div id="modal-overlay">
  <div id="modal">
    <div id="modal-msg"></div>
    <div id="modal-btns">
      <button id="modal-cancel" class="modal-btn">キャンセル</button>
      <button id="modal-ok" class="modal-btn danger">削除</button>
    </div>
  </div>
</div>

<script>
'use strict';

const BUILD = 26;
document.getElementById('build').textContent = `build ${BUILD}`;

const SNAP_DIST   = 20;
const ACTION_W_DEF  = 180;
const ACTION_H      = 36;   // action bar height (px)
const LANE_H      = 42;   // height per lane  (action + 6px gap)
const LANE_PAD    = 14;   // section top/bottom padding

let _id = 1;
const uid = () => _id++;

const events   = [];  // { id, x, text }
const sections = [];  // { id, name, actions: [] }
// action: { id, x, w, text }

const scrollWrap = document.getElementById('scroll-wrap');
const tlContent  = document.getElementById('tl-content');
const addSecRow  = document.getElementById('add-sec-row');
const ctx        = document.getElementById('ctx');

// ── Persistence (localStorage) ────────────────────
const STORAGE_KEY = 'myplotline_v1';

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ _id, events, sections }));
  } catch (_) {}
}

let _saveTimer = null;
function scheduleSave() { // debounced save for text inputs
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveData, 500);
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    _id = data._id ?? 1;
    events.push(...(data.events ?? []));
    const secs = data.sections ?? [];
    // Migrate legacy field name: sections used to store their items as `tasks`.
    for (const sec of secs) {
      if (sec.tasks && !sec.actions) { sec.actions = sec.tasks; delete sec.tasks; }
    }
    sections.push(...secs);
    return true;
  } catch (_) { return false; }
}

// ── Modal (confirm dialog) ────────────────────────
const modalOverlay = document.getElementById('modal-overlay');
const modalMsg     = document.getElementById('modal-msg');
const modalOk      = document.getElementById('modal-ok');
const modalCancel  = document.getElementById('modal-cancel');
let   modalOkFn    = null;

function showModal(msg, okFn, okLabel = '削除') {
  modalMsg.textContent = msg;
  modalOk.textContent  = okLabel;
  modalOkFn = okFn;
  modalOverlay.style.display = 'flex';
}
function hideModal() { modalOverlay.style.display = 'none'; modalOkFn = null; }
modalOk.addEventListener('click', () => { const fn = modalOkFn; hideModal(); if (fn) fn(); });
modalCancel.addEventListener('click', hideModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) hideModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalOverlay.style.display === 'flex') hideModal();
});

// ── Context menu ──────────────────────────────────
let ctxOpenedAt = 0;
function showCtx(mx, my, items) {
  ctx.innerHTML = '';
  items.forEach(item => {
    const el = document.createElement('div');
    el.textContent = item.label;
    el.addEventListener('click', e => { e.stopPropagation(); hideCtx(); item.fn(); });
    ctx.appendChild(el);
  });
  // Keep menu on-screen
  const mw = 160, mh = 16 + items.length * 38;
  ctx.style.left    = `${Math.min(mx, window.innerWidth  - mw)}px`;
  ctx.style.top     = `${Math.min(my, window.innerHeight - mh)}px`;
  ctx.style.display = 'block';
  ctxOpenedAt = Date.now();
}
function hideCtx() { ctx.style.display = 'none'; }
// Ignore the synthetic click that immediately follows a touch long-press
document.addEventListener('click', () => { if (Date.now() - ctxOpenedAt > 350) hideCtx(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtx(); });

// ── Touch long-press → invoke handler (mouse uses contextmenu instead) ──
function attachLongPress(el, handler) {
  let timer = null, sx = 0, sy = 0;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    sx = e.clientX; sy = e.clientY;
    clearTimeout(timer);
    timer = setTimeout(() => { timer = null; handler(e); }, 500);
  });
  el.addEventListener('pointermove', e => {
    if (timer && (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8)) {
      clearTimeout(timer); timer = null;
    }
  });
  const clear = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('pointerup', clear);
  el.addEventListener('pointercancel', clear);
}

// ── Snap ──────────────────────────────────────────
// Unified: snaps x to events, action edges, and action fade positions.
// excludeActionId: skip this action's own snap points (use when moving/resizing that action).
// excludeEvId:   skip this event's own position (use when dragging that event).
function snapToAny(x, excludeActionId = null, excludeEvId = null) {
  let best = null, d = SNAP_DIST;
  for (const ev of events) {
    if (ev.id === excludeEvId) continue;
    const dd = Math.abs(ev.x - x);
    if (dd < d) { d = dd; best = ev.x; }
  }
  for (const sec of sections) {
    for (const t of sec.actions) {
      if (t.id === excludeActionId) continue;
      const pts = [t.x, t.x + t.w];
      if (t.fadeIn  > 0) pts.push(t.x + t.fadeIn);
      if (t.fadeOut > 0) pts.push(t.x + t.w - t.fadeOut);
      for (const pt of pts) {
        const dd = Math.abs(pt - x);
        if (dd < d) { d = dd; best = pt; }
      }
    }
  }
  return best; // null if no snap
}

// When moving a whole action, every reference point on it (left edge, right edge,
// fade-in line, fade-out line) should be able to snap. Try all of them and pick
// the closest snap, returning the resulting action left-edge x (or null for none).
function snapMoveX(rawX, action) {
  const offsets = [0, action.w];               // left edge, right edge
  if (action.fadeIn  > 0) offsets.push(action.fadeIn);          // fade-in line
  if (action.fadeOut > 0) offsets.push(action.w - action.fadeOut); // fade-out line
  let bestX = null, bestD = SNAP_DIST;
  for (const off of offsets) {
    const snapped = snapToAny(rawX + off, action.id);
    if (snapped === null) continue;
    const d = Math.abs(snapped - (rawX + off));
    if (d < bestD) { bestD = d; bestX = snapped - off; }
  }
  return bestX; // null if no snap
}

// ── Edge-alignment markers ─────────────────────────
const ALIGN_TOL = 1.5; // px — treat as aligned if within this distance

function makeChevronMark() {
  const NS = 'http://www.w3.org/2000/svg';
  const el = document.createElement('div');
  el.className = 'action-mark';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', '20'); svg.setAttribute('height', '13');
  svg.setAttribute('viewBox', '0 0 20 13');
  const pl = document.createElementNS(NS, 'polyline');
  pl.setAttribute('points', '1,1 10,12 19,1');
  pl.setAttribute('fill', 'none');
  pl.setAttribute('stroke', 'currentColor');
  pl.setAttribute('stroke-width', '2.5');
  pl.setAttribute('stroke-linecap', 'round');
  pl.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(pl);
  el.appendChild(svg);
  return el;
}

function updateActionMarkers(bar, action) {
  bar.querySelectorAll('.action-mark').forEach(el => el.remove());

  // Snap targets: event positions + other actions' right edges
  const targets = events.map(ev => ev.x);
  for (const sec of sections)
    for (const t of sec.actions)
      if (t.id !== action.id) targets.push(t.x + t.w);

  // Chevron at left edge when it aligns with any target
  for (const tgt of targets) {
    if (Math.abs(action.x - tgt) < ALIGN_TOL) {
      const m = makeChevronMark();
      m.classList.add('action-mark-l');
      bar.appendChild(m);
      break;
    }
  }

  // Chevron at fade-out start position when it aligns with any target
  if (action.fadeOut > 0) {
    const foAbs = action.x + action.w - action.fadeOut;
    for (const tgt of targets) {
      if (Math.abs(foAbs - tgt) < ALIGN_TOL) {
        const m = makeChevronMark();
        m.style.left = `${action.w - action.fadeOut}px`;
        bar.appendChild(m);
        break;
      }
    }
  }
}

// All reference points of a action: left edge, right edge, fade-in start, fade-out start.
function actionRefPoints(t) {
  const pts = [t.x, t.x + t.w];
  if (t.fadeIn  > 0) pts.push(t.x + t.fadeIn);
  if (t.fadeOut > 0) pts.push(t.x + t.w - t.fadeOut);
  return pts;
}

// Returns set of x positions where any two reference points of *different*
// actions coincide — i.e. every place something is snapped. A drop line is drawn
// at each, regardless of whether a ↓ marker is shown there. (Event positions
// already get their own drop lines, so those are not duplicated here.)
function collectAlignedActionEdges() {
  const pts = []; // { x, tid }
  for (const sec of sections)
    for (const t of sec.actions)
      for (const x of actionRefPoints(t)) pts.push({ x, tid: t.id });

  const xs = new Set();
  for (let i = 0; i < pts.length; i++)
    for (let j = i + 1; j < pts.length; j++)
      if (pts[i].tid !== pts[j].tid && Math.abs(pts[i].x - pts[j].x) < ALIGN_TOL)
        xs.add(Math.round((pts[i].x + pts[j].x) / 2));
  return xs;
}

function updateActionEdgeLines() {
  document.querySelectorAll('.action-edge-line').forEach(el => el.remove());
  const xs = collectAlignedActionEdges();
  if (xs.size === 0) return;
  for (const sec of sections) {
    const sc = document.getElementById(`sc-${sec.id}`);
    if (!sc) continue;
    for (const x of xs) {
      const ln = document.createElement('div');
      ln.className = 'action-edge-line';
      ln.style.left = `${x}px`;
      sc.appendChild(ln);
    }
  }
}

function updateAllActionMarkers() {
  for (const sec of sections) {
    for (const t of sec.actions) {
      const bar = document.getElementById(`action-${t.id}`);
      if (bar) updateActionMarkers(bar, t);
    }
  }
  updateActionEdgeLines();
}

// ── Lane layout ───────────────────────────────────
// Assign each action to a lane (row within a section).
// Actions sorted by x-start; later-starting actions that overlap get higher lanes (= lower on screen).
function computeLanes(actions) {
  const sorted   = [...actions].sort((a, b) => a.x - b.x);
  const laneEnds = []; // laneEnds[i] = right edge of last action placed in lane i
  const result   = new Map();
  for (const t of sorted) {
    let lane = laneEnds.findIndex(end => end <= t.x);
    if (lane === -1) lane = laneEnds.length; // need a new lane
    laneEnds[lane] = t.x + t.w;
    result.set(t.id, lane);
  }
  return result;
}

// Re-position all action bars in a section and resize the section row.
// Pass skipId to leave one action untouched (while it's being dragged).
function layoutSection(sec, skipId = null) {
  const lanes    = computeLanes(sec.actions);
  const numLanes = sec.actions.length > 0 ? Math.max(...lanes.values()) + 1 : 1;
  const secH     = LANE_PAD * 2 + numLanes * LANE_H;

  // Resize row
  const row = document.getElementById(`sec-row-${sec.id}`);
  if (row) row.querySelectorAll('.row-label, .row-content')
             .forEach(el => { el.style.height = `${secH}px`; });

  // Reposition bars
  for (const t of sec.actions) {
    if (t.id === skipId) continue;
    const bar = document.getElementById(`action-${t.id}`);
    if (!bar) continue;
    const lane        = lanes.get(t.id) ?? 0;
    bar.style.top       = `${LANE_PAD + lane * LANE_H}px`;
    bar.style.transform = 'none';
  }
}

function layoutAllSections() {
  for (const sec of sections) layoutSection(sec);
}

// ── Render events ─────────────────────────────────
function renderEvents() {
  tlContent.querySelectorAll('.ev-dot, .ev-label, .ev-drop-line').forEach(el => el.remove());
  for (const ev of events) {
    // Dot
    const dot = document.createElement('div');
    dot.className = 'ev-dot';
    dot.style.left = `${ev.x}px`;
    const dotMenu = e =>
      showCtx(e.clientX, e.clientY, [{ label: 'イベントを削除', fn: () => deleteEvent(ev.id) }]);
    dot.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); dotMenu(e); });
    attachLongPress(dot, dotMenu);

    // Drag dot left/right to reposition the event
    dot.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault(); e.stopPropagation();
      dot.setPointerCapture(e.pointerId);
      const sx = e.clientX, ox = ev.x;
      let moved = false;

      const onMove = ev2 => {
        const dx = ev2.clientX - sx;
        if (!moved && Math.abs(dx) < 4) return;
        moved = true;
        const raw = Math.max(0, ox + dx);
        const snapped = snapToAny(raw, null, ev.id);
        const nx = snapped !== null ? snapped : raw;
        ev.x = nx;
        // Snap visual feedback on the dot
        if (snapped !== null) dot.classList.add('snapping');
        else                  dot.classList.remove('snapping');
        // Move dot, label and timeline drop-line live
        dot.style.left = `${nx}px`;
        lw.style.left  = `${nx}px`;
        dl.style.left  = `${nx}px`;
        // Move all section drop-lines for this event
        document.querySelectorAll(`.sec-drop-line[data-ev-id="${ev.id}"]`)
          .forEach(ln => { ln.style.left = `${nx}px`; });
        // Update markers on all actions (event position changed)
        updateAllActionMarkers();
      };

      const onUp = () => {
        dot.removeEventListener('pointermove', onMove);
        dot.removeEventListener('pointerup',   onUp);
        dot.removeEventListener('pointercancel', onUp);
        dot.classList.remove('snapping');
        updateAllActionMarkers();
        if (moved) saveData();
        if (!moved && li) li.focus(); // tap → focus the label input
      };

      dot.addEventListener('pointermove', onMove);
      dot.addEventListener('pointerup',   onUp);
      dot.addEventListener('pointercancel', onUp);
    });

    tlContent.appendChild(dot);

    // Label
    const lw = document.createElement('div');
    lw.className = 'ev-label';
    lw.style.left = `${ev.x}px`;
    const li = document.createElement('input');
    li.type = 'text'; li.value = ev.text; li.placeholder = 'イベント名';
    li.setAttribute('data-ev', ev.id);
    li.addEventListener('mousedown', e => e.stopPropagation());
    li.addEventListener('input', e => { ev.text = e.target.value; scheduleSave(); });
    lw.appendChild(li);
    tlContent.appendChild(lw);

    // Drop line (bottom half of timeline row)
    const dl = document.createElement('div');
    dl.className = 'ev-drop-line';
    dl.style.left = `${ev.x}px`;
    tlContent.appendChild(dl);
  }
}

// ── Section drop lines ────────────────────────────
function makeSecLine(ev) {
  const ln = document.createElement('div');
  ln.className = 'sec-drop-line';
  ln.style.left = `${ev.x}px`;
  ln.dataset.evId = ev.id;
  return ln;
}

function refreshSecDropLines(secContent) {
  secContent.querySelectorAll('.sec-drop-line').forEach(el => el.remove());
  for (const ev of events) secContent.appendChild(makeSecLine(ev));
}

// ── Render section ────────────────────────────────
function renderSection(sec) {
  const row = document.createElement('div');
  row.className = 'row sec-row';
  row.id = `sec-row-${sec.id}`;

  // Label cell
  const lbl = document.createElement('div');
  lbl.className = 'row-label';
  const ni = document.createElement('input');
  ni.type = 'text'; ni.className = 'sec-name-input';
  ni.value = sec.name; ni.placeholder = 'セクション名';
  ni.addEventListener('input', e => { sec.name = e.target.value; scheduleSave(); });
  lbl.appendChild(ni);

  const del = document.createElement('button');
  del.className = 'sec-del-btn';
  del.textContent = '×';
  del.title = 'セクションを削除';
  del.addEventListener('click', e => { e.stopPropagation(); requestDeleteSection(sec.id); });
  del.addEventListener('pointerdown', e => e.stopPropagation());
  lbl.appendChild(del);

  row.appendChild(lbl);

  // Content cell
  const sc = document.createElement('div');
  sc.className = 'row-content';
  sc.id = `sc-${sec.id}`;

  // Drop lines from existing events
  for (const ev of events) sc.appendChild(makeSecLine(ev));

  // Existing actions
  for (const t of sec.actions) appendAction(sc, sec, t);

  // Single tap/click on empty area → add a action.
  // Ignore if the pointer moved (scroll drag): track down position and
  // only fire when total travel is within TAP_MAX pixels.
  const TAP_MAX = 8;
  let tapDown = null;
  sc.addEventListener('pointerdown', e => {
    if (e.target !== sc && !e.target.classList.contains('sec-drop-line')) return;
    tapDown = { x: e.clientX, y: e.clientY };
  });
  sc.addEventListener('pointermove', e => {
    if (!tapDown) return;
    if (Math.abs(e.clientX - tapDown.x) > TAP_MAX ||
        Math.abs(e.clientY - tapDown.y) > TAP_MAX) {
      tapDown = null; // moved too far → not a tap
    }
  });
  sc.addEventListener('pointerup', e => {
    if (!tapDown) return;
    tapDown = null;
    if (e.target !== sc && !e.target.classList.contains('sec-drop-line')) return;
    const rect = sc.getBoundingClientRect();
    addAction(sec.id, e.clientX - rect.left);
  });
  sc.addEventListener('pointercancel', () => { tapDown = null; });

  row.appendChild(sc);
  scrollWrap.insertBefore(row, addSecRow);
  return ni;
}

// ── Fade shape & handles ──────────────────────────
const FADE_MIN = 10; // minimum fade length (px)

function updateActionShape(bar, action) {
  const fi = Math.max(0, Math.min(action.fadeIn,  action.w - Math.max(0, action.fadeOut)));
  const fo = Math.max(0, Math.min(action.fadeOut, action.w - fi));

  // Remove any previous SVG shape
  bar.querySelector('.action-shape-svg')?.remove();

  if (fi === 0 && fo === 0) {
    // Plain (square) rectangle: restore CSS border/background
    bar.classList.remove('has-fade');
    bar.style.clipPath     = '';
    bar.style.borderRadius = '';
    bar.style.background   = '';
    bar.style.border       = '';
  } else {
    // Trapezoid: draw with SVG so the diagonal edges get a proper stroke
    const w = action.w, h = ACTION_H;
    const NS  = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.classList.add('action-shape-svg');
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);

    const poly = document.createElementNS(NS, 'polygon');
    poly.classList.add('action-shape-poly');
    poly.setAttribute('points', `${fi},0 ${w - fo},0 ${w},${h} 0,${h}`);
    svg.appendChild(poly);
    bar.insertBefore(svg, bar.firstChild);

    // Let SVG handle visual; hide the CSS border/background
    bar.classList.add('has-fade');
    bar.style.clipPath     = '';
    bar.style.borderRadius = '0';
    bar.style.background   = 'transparent';
    bar.style.border       = 'none';
  }

  // Offset text to start at the slope's top edge, not behind it
  const HANDLE_W = 14;
  const ti = bar.querySelector('.action-text');
  if (ti) {
    ti.style.paddingLeft  = action.fadeIn  > HANDLE_W ? `${action.fadeIn  - HANDLE_W}px` : '';
    ti.style.paddingRight = action.fadeOut > HANDLE_W ? `${action.fadeOut - HANDLE_W}px` : '';
  }
}

function setupFadeHandleDrag(handle, bar, sec, action, type) {
  const delFn = () => {
    if (type === 'in') action.fadeIn = 0; else action.fadeOut = 0;
    updateActionShape(bar, action);
    updateFadeHandles(bar, sec, action);
  };
  const delMenu = e => showCtx(e.clientX, e.clientY, [{ label: '削除', fn: delFn }]);
  handle.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); delMenu(e); });
  attachLongPress(handle, delMenu);

  handle.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    const sx = e.clientX;
    const initVal = type === 'in' ? action.fadeIn : action.fadeOut;
    let moved = false;

    const onMove = ev => {
      const dx = ev.clientX - sx;
      if (!moved && Math.abs(dx) < 3) return;
      moved = true;
      if (type === 'in') {
        // Absolute position of the fade-in dividing line
        const rawAbs = action.x + initVal + dx;
        const snapped = snapToAny(rawAbs, action.id);
        const abs = snapped !== null ? snapped : rawAbs;
        action.fadeIn = Math.max(0, Math.min(abs - action.x, action.w - Math.max(action.fadeOut, 0) - FADE_MIN));
        if (snapped !== null) handle.classList.add('snapping');
        else                  handle.classList.remove('snapping');
        handle.style.left = `${action.fadeIn}px`;
      } else {
        // Absolute position of the fade-out dividing line
        const rawAbs = action.x + action.w - initVal + dx;
        const snapped = snapToAny(rawAbs, action.id);
        const abs = snapped !== null ? snapped : rawAbs;
        action.fadeOut = Math.max(0, Math.min(action.x + action.w - abs, action.w - Math.max(action.fadeIn, 0) - FADE_MIN));
        if (snapped !== null) handle.classList.add('snapping');
        else                  handle.classList.remove('snapping');
        handle.style.left = `${action.w - action.fadeOut}px`;
      }
      updateActionShape(bar, action);
      updateActionMarkers(bar, action);
      updateActionEdgeLines();
    };
    const onUp = ev => {
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup',   onUp);
      handle.removeEventListener('pointercancel', onUp);
      handle.classList.remove('snapping');
      if (!moved) { delMenu(ev); return; }
      // Auto-remove if dragged all the way to 0
      if ((type === 'in' && action.fadeIn <= 0) || (type === 'out' && action.fadeOut <= 0)) {
        delFn();
      }
      updateActionMarkers(bar, action);
      updateActionEdgeLines();
      saveData();
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup',   onUp);
    handle.addEventListener('pointercancel', onUp);
  });
}

function updateFadeHandles(bar, sec, action) {
  bar.querySelectorAll('.fade-handle').forEach(el => el.remove());
  if (action.fadeIn > 0) {
    const h = document.createElement('div');
    h.className = 'fade-handle';
    h.style.left = `${action.fadeIn}px`;
    bar.appendChild(h);
    setupFadeHandleDrag(h, bar, sec, action, 'in');
  }
  if (action.fadeOut > 0) {
    const h = document.createElement('div');
    h.className = 'fade-handle';
    h.style.left = `${action.w - action.fadeOut}px`;
    bar.appendChild(h);
    setupFadeHandleDrag(h, bar, sec, action, 'out');
  }
}

// ── Action element ──────────────────────────────────
function appendAction(container, sec, action) {
  const bar = document.createElement('div');
  bar.className = 'action-bar';
  bar.id = `action-${action.id}`;
  bar.style.left  = `${action.x}px`;
  bar.style.width = `${action.w}px`;

  const lh = document.createElement('div'); lh.className = 't-handle tl'; lh.innerHTML = '⋮';
  const ti = document.createElement('input');
  ti.type = 'text'; ti.className = 'action-text'; ti.value = action.text; ti.placeholder = 'アクション名';
  ti.addEventListener('input', e => { action.text = e.target.value; scheduleSave(); });
  const rh = document.createElement('div'); rh.className = 't-handle tr'; rh.innerHTML = '⋮';

  bar.appendChild(lh); bar.appendChild(ti); bar.appendChild(rh);
  container.appendChild(bar);

  bar.addEventListener('contextmenu', e => {
    if (e.target === lh || e.target === rh || e.target.classList.contains('fade-handle')) return;
    e.preventDefault(); e.stopPropagation();
    showCtx(e.clientX, e.clientY, [{ label: 'アクションを削除', fn: () => deleteAction(sec.id, action.id) }]);
  });

  updateActionShape(bar, action);
  updateFadeHandles(bar, sec, action);
  setupDrag(bar, sec, action, lh, rh);
  return bar;
}

// ── Drag / resize (Pointer Events: mouse + touch + pen) ──
const DRAG_THRESH = 6; // px before a press becomes a drag

function setupDrag(bar, sec, action, lh, rh) {
  bar.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.classList.contains('fade-handle')) return; // handled by fade drag
    const isHandle   = (e.target === lh || e.target === rh);
    const pressedLH  = e.target === lh;
    const pressedRH  = e.target === rh;
    const mode       = pressedLH ? 'l' : pressedRH ? 'r' : 'move';
    const input      = bar.querySelector('.action-text');
    const sx = e.clientX, st = { x: action.x, w: action.w };
    let started   = false; // true only after actual movement; handles tap detection for lh/rh
    let menuShown = false;
    let lpTimer   = null;

    bar.setPointerCapture(e.pointerId);
    e.preventDefault();
    if (isHandle) bar.classList.add('dragging');

    // Touch long-press on body → delete menu
    if (e.pointerType === 'touch' && !isHandle) {
      lpTimer = setTimeout(() => {
        lpTimer = null; menuShown = true;
        try { bar.releasePointerCapture(e.pointerId); } catch (_) {}
        showCtx(e.clientX, e.clientY,
          [{ label: 'アクションを削除', fn: () => deleteAction(sec.id, action.id) }]);
      }, 500);
    }

    const onMove = ev => {
      const dx = ev.clientX - sx;
      if (lpTimer && Math.abs(dx) > DRAG_THRESH) { clearTimeout(lpTimer); lpTimer = null; }
      if (menuShown) return;
      if (!started) {
        if (Math.abs(dx) < DRAG_THRESH) return;
        started = true;
        bar.classList.add('dragging');
        if (document.activeElement) document.activeElement.blur();
      }
      ev.preventDefault();

      if (mode === 'move') {
        const raw = Math.max(0, st.x + dx);
        const snappedX = snapMoveX(raw, action);
        if (snappedX !== null) { action.x = Math.max(0, snappedX); bar.classList.add('snapping'); }
        else                   { action.x = raw;                   bar.classList.remove('snapping'); }
        bar.style.left = `${action.x}px`;
      } else if (mode === 'r') {
        let w = Math.max(50, st.w + dx);
        const sr = snapToAny(st.x + w, action.id);
        if (sr !== null) { w = Math.max(50, sr - st.x); bar.classList.add('snapping'); }
        else             { bar.classList.remove('snapping'); }
        action.w = w; bar.style.width = `${w}px`;
        updateActionShape(bar, action);   // shape adjusts to new width
        updateFadeHandles(bar, sec, action); // keep fade dots glued to the slope
      } else { // 'l'
        let nw = Math.max(50, st.w - dx);
        let nx = Math.max(0, st.x + st.w - nw);
        const sl = snapToAny(nx, action.id);
        if (sl !== null) { nx = sl; nw = st.x + st.w - nx; bar.classList.add('snapping'); }
        else             { bar.classList.remove('snapping'); }
        action.x = nx; action.w = nw;
        bar.style.left = `${nx}px`; bar.style.width = `${nw}px`;
        updateActionShape(bar, action);
        updateFadeHandles(bar, sec, action); // keep fade dots glued to the slope
      }
      updateActionMarkers(bar, action);
      updateActionEdgeLines();
      layoutSection(sec, action.id);
    };

    const onUp = ev => {
      if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
      try { bar.releasePointerCapture(ev.pointerId); } catch (_) {}
      bar.removeEventListener('pointermove', onMove);
      bar.removeEventListener('pointerup',   onUp);
      bar.removeEventListener('pointercancel', onUp);
      bar.classList.remove('dragging', 'snapping');
      layoutSection(sec);
      updateActionShape(bar, action);
      updateFadeHandles(bar, sec, action); // reposition after resize
      updateActionMarkers(bar, action);
      updateActionEdgeLines();
      if (started) saveData(); // persist position/size changes

      if (!started && !menuShown) {
        // Tap on lh/rh → fade menu (if no fade yet)
        if (pressedLH && action.fadeIn === 0) {
          showCtx(ev.clientX, ev.clientY, [{
            label: 'フェードイン追加',
            fn: () => { action.fadeIn = Math.round(action.w * 0.2); updateActionShape(bar, action); updateFadeHandles(bar, sec, action); }
          }]);
        } else if (pressedRH && action.fadeOut === 0) {
          showCtx(ev.clientX, ev.clientY, [{
            label: 'フェードアウト追加',
            fn: () => { action.fadeOut = Math.round(action.w * 0.2); updateActionShape(bar, action); updateFadeHandles(bar, sec, action); }
          }]);
        } else if (!pressedLH && !pressedRH && input) {
          input.focus();
        }
      }
    };

    bar.addEventListener('pointermove', onMove);
    bar.addEventListener('pointerup', onUp);
    bar.addEventListener('pointercancel', onUp);
  });
}

// ── Actions ───────────────────────────────────────
function addEvent(x) {
  const ev = { id: uid(), x, text: '' };
  events.push(ev);
  saveData();
  renderEvents();
  // Add drop lines to all sections
  for (const sec of sections) {
    const sc = document.getElementById(`sc-${sec.id}`);
    if (sc) sc.appendChild(makeSecLine(ev));
  }
  updateAllActionMarkers();
  requestAnimationFrame(() => {
    const inp = document.querySelector(`[data-ev="${ev.id}"]`);
    if (inp) inp.focus();
  });
}

function deleteEvent(id) {
  const i = events.findIndex(e => e.id === id);
  if (i < 0) return;
  events.splice(i, 1);
  saveData();
  renderEvents();
  for (const sec of sections) {
    const sc = document.getElementById(`sc-${sec.id}`);
    if (sc) refreshSecDropLines(sc);
  }
  updateAllActionMarkers();
}

function addSection() {
  const sec = { id: uid(), name: '', actions: [] };
  sections.push(sec);
  saveData();
  const ni = renderSection(sec);
  requestAnimationFrame(() => ni.focus());
}

function requestDeleteSection(secId) {
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  if (sec.actions.length > 0) {
    const label = sec.name ? `「${sec.name}」` : 'このセクション';
    showModal(`${label}には ${sec.actions.length} 個のアクションがあります。\nセクションごと削除しますか？`,
      () => deleteSection(secId));
  } else {
    deleteSection(secId);
  }
}

function deleteSection(secId) {
  const i = sections.findIndex(s => s.id === secId);
  if (i < 0) return;
  sections.splice(i, 1);
  saveData();
  const row = document.getElementById(`sec-row-${secId}`);
  if (row) row.remove();
  updateAllActionMarkers(); // action-edge lines may reference deleted actions
}

function addAction(secId, clickX) {
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  let x;
  if (clickX != null) {
    // Center the new bar on the double-click point, then snap edges to events
    x = Math.max(0, clickX - ACTION_W_DEF / 2);
    const sl = snapToAny(x);
    const sr = snapToAny(x + ACTION_W_DEF);
    if (sl !== null) x = sl;
    else if (sr !== null) x = sr - ACTION_W_DEF;
  } else {
    const last = sec.actions[sec.actions.length - 1];
    x = last ? last.x + last.w + 12 : 20;
  }
  const action = { id: uid(), x, w: ACTION_W_DEF, text: '', fadeIn: 0, fadeOut: 0 };
  sec.actions.push(action);
  saveData();
  const sc = document.getElementById(`sc-${secId}`);
  if (!sc) return;
  const bar = appendAction(sc, sec, action);
  layoutSection(sec);
  updateActionMarkers(bar, action);
  requestAnimationFrame(() => {
    const inp = document.querySelector(`#action-${action.id} input`);
    if (inp) inp.focus();
  });
}

function deleteAction(secId, actionId) {
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  const i = sec.actions.findIndex(t => t.id === actionId);
  if (i >= 0) sec.actions.splice(i, 1);
  saveData();
  const el = document.getElementById(`action-${actionId}`);
  if (el) el.remove();
  layoutSection(sec);
}

// ── Timeline click ────────────────────────────────
tlContent.addEventListener('click', e => {
  if (e.target !== tlContent && !e.target.matches('#timeline-line')) return;
  const rect = tlContent.getBoundingClientRect();
  addEvent(e.clientX - rect.left);
});

// ── Hamburger menu ────────────────────────────────
const hamburger = document.getElementById('hamburger');
const menu      = document.getElementById('menu');

hamburger.addEventListener('click', e => {
  e.stopPropagation();
  menu.classList.toggle('open');
});
document.addEventListener('click', e => {
  if (!menu.contains(e.target) && e.target !== hamburger) menu.classList.remove('open');
});

function newProject() {
  events.length = 0;
  sections.length = 0;
  _id = 1;
  saveData();
  // Clear the rendered rows
  tlContent.querySelectorAll('.ev-dot, .ev-label, .ev-drop-line').forEach(el => el.remove());
  document.querySelectorAll('.sec-row').forEach(el => el.remove());
  document.querySelectorAll('.action-edge-line').forEach(el => el.remove());
}

document.getElementById('menu-new').addEventListener('click', () => {
  menu.classList.remove('open');
  const hasData = events.length > 0 || sections.length > 0;
  if (hasData) {
    showModal('現在の内容をすべて削除して新規作成しますか？\nこの操作は取り消せません。',
      newProject, '新規作成');
  } else {
    newProject();
  }
});

// ── Init ──────────────────────────────────────────
document.getElementById('btn-add-sec').addEventListener('click', addSection);
if (loadData()) {
  // Restore saved state
  renderEvents();
  for (const sec of sections) { renderSection(sec); layoutSection(sec); }
  updateAllActionMarkers();
}
// Fresh start: just the event timeline, no sections.
</script>
