<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MyPlotLine</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2128;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #7d8590;
  --accent: #f78166;
  --accent-glow: rgba(247,129,102,.35);
  --task-bg: #1c3052;
  --task-bd: #388bfd;
  --label-w: 160px;
  --tl-h: 80px;
  --sec-h: 70px;
  --content-w: 3200px;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 13px; }

#app { height: 100%; display: flex; flex-direction: column; }

/* ── Header ── */
#header { flex-shrink: 0; height: 44px; background: var(--surface);
  border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; }
#header h1 { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .5px; }

/* ── Scroll wrap ── */
#scroll-wrap { flex: 1; overflow: auto; }

/* ── Row ── */
.row { display: flex; align-items: stretch; }

/* ── Label cell (sticky-left) ── */
.row-label { width: var(--label-w); min-width: var(--label-w); flex-shrink: 0;
  position: sticky; left: 0; z-index: 30; background: var(--surface);
  border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 14px; }

/* ── Content cell ── */
.row-content { flex-shrink: 0; width: var(--content-w); position: relative;
  border-bottom: 1px solid var(--border); background: var(--bg); overflow: visible; }

/* ── Timeline row ── */
#timeline-row .row-label { height: var(--tl-h); font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .8px; }
#timeline-row .row-content { height: var(--tl-h); background: var(--surface2); cursor: crosshair;
  touch-action: manipulation; }

#timeline-line { position: absolute; top: 50%; left: 0; right: 0; height: 2px;
  background: var(--border); pointer-events: none; transform: translateY(-50%); }

/* ── Event dot ── */
.ev-dot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
  transform: translate(-50%, -50%); cursor: pointer; z-index: 15;
  touch-action: none; transition: box-shadow .15s, transform .1s; }
.ev-dot:hover { box-shadow: 0 0 0 6px var(--accent-glow); transform: translate(-50%, -50%) scale(1.2); }
.ev-dot.snapping { box-shadow: 0 0 0 7px var(--accent-glow), 0 0 14px var(--accent); transform: translate(-50%, -50%) scale(1.25); }

/* ── Event label ── */
.ev-label { position: absolute; top: 7px; transform: translateX(-50%); z-index: 16; }
.ev-label input { background: transparent; border: none; border-bottom: 1px solid transparent;
  color: var(--text); font-size: 10px; width: 88px; text-align: center; outline: none;
  cursor: default; padding: 1px 3px; }
.ev-label input:focus { cursor: text; border-bottom-color: var(--accent);
  background: rgba(247,129,102,.1); border-radius: 2px 2px 0 0; }

/* ── Event drop line (in timeline row, lower half) ── */
.ev-drop-line { position: absolute; top: calc(50% + 6px); bottom: 0;
  width: 0; border-left: 1.5px dashed rgba(247,129,102,.5);
  transform: translateX(-50%); pointer-events: none; z-index: 5; }

/* ── Section row ── */
.sec-row .row-label { height: var(--sec-h); }
.sec-row .row-content { height: var(--sec-h); cursor: copy; touch-action: manipulation; }

.sec-name-input { background: transparent; border: none; outline: none;
  color: var(--text); font-size: 12px; font-weight: 500; width: 100%; cursor: default; }
.sec-name-input:focus { cursor: text; }

/* ── Event drop line in section ── */
.sec-drop-line { position: absolute; top: 0; bottom: 0; width: 0;
  border-left: 1.5px dashed rgba(247,129,102,.3);
  transform: translateX(-50%); pointer-events: none; z-index: 2; }

/* ── Task bar ── */
.task-bar { position: absolute; top: 50%; transform: translateY(-50%); height: 36px;
  background: var(--task-bg); border: 1.5px solid var(--task-bd); border-radius: 6px;
  display: flex; align-items: center; cursor: grab; user-select: none;
  -webkit-user-select: none; -webkit-touch-callout: none; z-index: 10;
  min-width: 50px; touch-action: none; transition: box-shadow .1s, border-color .1s; }
.task-bar:hover { box-shadow: 0 2px 10px rgba(56,139,253,.3); }
.task-bar.dragging { cursor: grabbing; opacity: .88; z-index: 50; }
.task-bar.snapping { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }

/* ── Edge-alignment markers ── */
.task-mark {
  position: absolute; top: -15px; font-size: 12px; line-height: 1;
  color: var(--accent); pointer-events: none; z-index: 20; font-weight: 700;
  filter: drop-shadow(0 0 3px var(--accent));
}
.task-mark-l { left: 0;  transform: translateX(-50%); }
.task-mark-r { right: 0; transform: translateX(50%); }

.task-text { flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 11px; padding: 0 5px; cursor: default;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.task-text:focus { cursor: text; }

.t-handle { width: 14px; height: 100%; cursor: ew-resize; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.2); font-size: 9px; transition: color .1s; }
.t-handle:hover { color: rgba(255,255,255,.5); }
.t-handle.tl { border-radius: 4px 0 0 4px; }
.t-handle.tr { border-radius: 0 4px 4px 0; }

/* ── Add section row ── */
#add-sec-row .row-label { height: 52px; border-bottom: none; padding: 8px 14px; }
#add-sec-row .row-content { height: 52px; border-bottom: none; background: transparent; }

.btn-add-section { width: 100%; background: transparent; border: 1px dashed var(--border);
  color: var(--muted); font-size: 11px; padding: 6px 10px; border-radius: 5px; cursor: pointer;
  transition: border-color .15s, color .15s; }
.btn-add-section:hover { border-color: var(--accent); color: var(--accent); }

/* ── Context menu ── */
#ctx { position: fixed; background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: 4px 0; z-index: 9999; box-shadow: 0 8px 28px rgba(0,0,0,.6);
  display: none; min-width: 120px; }
#ctx div { padding: 10px 18px; cursor: pointer; color: var(--text); font-size: 13px; }
#ctx div:hover { background: var(--surface2); color: var(--accent); }

/* ── Build badge ── */
#build { position: fixed; bottom: 8px; right: 12px; font-size: 9px; color: #3d444d;
  pointer-events: none; z-index: 9999; font-family: monospace; letter-spacing: .5px; }
</style>
</head>
<body>

<div id="app">
  <div id="header"><h1>MyPlotLine</h1></div>

  <div id="scroll-wrap">
    <!-- Timeline row -->
    <div class="row" id="timeline-row">
      <div class="row-label">Timeline</div>
      <div class="row-content" id="tl-content">
        <div id="timeline-line"></div>
      </div>
    </div>
    <!-- Section rows injected by JS -->
    <!-- Add section row -->
    <div class="row" id="add-sec-row">
      <div class="row-label">
        <button class="btn-add-section" id="btn-add-sec">＋ セクション追加</button>
      </div>
      <div class="row-content"></div>
    </div>
  </div>
</div>

<div id="ctx"></div>
<div id="build">build 8</div>

<script>
'use strict';

const BUILD = 8;
const SNAP_DIST   = 20;
const TASK_W_DEF  = 180;

let _id = 1;
const uid = () => _id++;

const events   = [];  // { id, x, text }
const sections = [];  // { id, name, tasks: [] }
// task: { id, x, w, text }

const scrollWrap = document.getElementById('scroll-wrap');
const tlContent  = document.getElementById('tl-content');
const addSecRow  = document.getElementById('add-sec-row');
const ctx        = document.getElementById('ctx');

// ── Context menu ──────────────────────────────────
let ctxOpenedAt = 0;
function showCtx(mx, my, items) {
  ctx.innerHTML = '';
  items.forEach(item => {
    const el = document.createElement('div');
    el.textContent = item.label;
    el.addEventListener('click', e => { e.stopPropagation(); hideCtx(); item.fn(); });
    ctx.appendChild(el);
  });
  // Keep menu on-screen
  const mw = 160, mh = 16 + items.length * 38;
  ctx.style.left    = `${Math.min(mx, window.innerWidth  - mw)}px`;
  ctx.style.top     = `${Math.min(my, window.innerHeight - mh)}px`;
  ctx.style.display = 'block';
  ctxOpenedAt = Date.now();
}
function hideCtx() { ctx.style.display = 'none'; }
// Ignore the synthetic click that immediately follows a touch long-press
document.addEventListener('click', () => { if (Date.now() - ctxOpenedAt > 350) hideCtx(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtx(); });

// ── Touch long-press → invoke handler (mouse uses contextmenu instead) ──
function attachLongPress(el, handler) {
  let timer = null, sx = 0, sy = 0;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    sx = e.clientX; sy = e.clientY;
    clearTimeout(timer);
    timer = setTimeout(() => { timer = null; handler(e); }, 500);
  });
  el.addEventListener('pointermove', e => {
    if (timer && (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8)) {
      clearTimeout(timer); timer = null;
    }
  });
  const clear = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('pointerup', clear);
  el.addEventListener('pointercancel', clear);
}

// ── Snap ──────────────────────────────────────────
function snapTo(x, excludeId = null) {
  let best = null, d = SNAP_DIST;
  for (const ev of events) {
    if (ev.id === excludeId) continue;
    const dd = Math.abs(ev.x - x); if (dd < d) { d = dd; best = ev.x; }
  }
  return best; // null if no snap
}

// Snap x to any task's left or right edge across all sections
function snapToTaskEdge(x) {
  let best = null, d = SNAP_DIST;
  for (const sec of sections) {
    for (const t of sec.tasks) {
      for (const edge of [t.x, t.x + t.w]) {
        const dd = Math.abs(edge - x);
        if (dd < d) { d = dd; best = edge; }
      }
    }
  }
  return best; // null if no snap
}

// ── Edge-alignment markers ─────────────────────────
const ALIGN_TOL = 1.5; // px — treat as aligned if within this distance

function updateTaskMarkers(bar, task) {
  bar.querySelectorAll('.task-mark').forEach(el => el.remove());
  let hasL = false, hasR = false;
  for (const ev of events) {
    if (!hasL && Math.abs(task.x - ev.x) < ALIGN_TOL) {
      const m = document.createElement('span');
      m.className = 'task-mark task-mark-l';
      m.textContent = '↓';
      bar.appendChild(m);
      hasL = true;
    }
    if (!hasR && Math.abs((task.x + task.w) - ev.x) < ALIGN_TOL) {
      const m = document.createElement('span');
      m.className = 'task-mark task-mark-r';
      m.textContent = '↑';
      bar.appendChild(m);
      hasR = true;
    }
    if (hasL && hasR) break;
  }
}

function updateAllTaskMarkers() {
  for (const sec of sections) {
    for (const t of sec.tasks) {
      const bar = document.getElementById(`task-${t.id}`);
      if (bar) updateTaskMarkers(bar, t);
    }
  }
}

// ── Render events ─────────────────────────────────
function renderEvents() {
  tlContent.querySelectorAll('.ev-dot, .ev-label, .ev-drop-line').forEach(el => el.remove());
  for (const ev of events) {
    // Dot
    const dot = document.createElement('div');
    dot.className = 'ev-dot';
    dot.style.left = `${ev.x}px`;
    const dotMenu = e =>
      showCtx(e.clientX, e.clientY, [{ label: 'イベントを削除', fn: () => deleteEvent(ev.id) }]);
    dot.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); dotMenu(e); });
    attachLongPress(dot, dotMenu);

    // Drag dot left/right to reposition the event
    dot.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault(); e.stopPropagation();
      dot.setPointerCapture(e.pointerId);
      const sx = e.clientX, ox = ev.x;
      let moved = false;

      const onMove = ev2 => {
        const dx = ev2.clientX - sx;
        if (!moved && Math.abs(dx) < 4) return;
        moved = true;
        const raw = Math.max(0, ox + dx);
        const snapped = snapToTaskEdge(raw);
        const nx = snapped !== null ? snapped : raw;
        ev.x = nx;
        // Snap visual feedback on the dot
        if (snapped !== null) dot.classList.add('snapping');
        else                  dot.classList.remove('snapping');
        // Move dot, label and timeline drop-line live
        dot.style.left = `${nx}px`;
        lw.style.left  = `${nx}px`;
        dl.style.left  = `${nx}px`;
        // Move all section drop-lines for this event
        document.querySelectorAll(`.sec-drop-line[data-ev-id="${ev.id}"]`)
          .forEach(ln => { ln.style.left = `${nx}px`; });
        // Update markers on all tasks (event position changed)
        updateAllTaskMarkers();
      };

      const onUp = () => {
        dot.removeEventListener('pointermove', onMove);
        dot.removeEventListener('pointerup',   onUp);
        dot.removeEventListener('pointercancel', onUp);
        dot.classList.remove('snapping');
        updateAllTaskMarkers();
        if (!moved && li) li.focus(); // tap → focus the label input
      };

      dot.addEventListener('pointermove', onMove);
      dot.addEventListener('pointerup',   onUp);
      dot.addEventListener('pointercancel', onUp);
    });

    tlContent.appendChild(dot);

    // Label
    const lw = document.createElement('div');
    lw.className = 'ev-label';
    lw.style.left = `${ev.x}px`;
    const li = document.createElement('input');
    li.type = 'text'; li.value = ev.text; li.placeholder = 'イベント名';
    li.setAttribute('data-ev', ev.id);
    li.addEventListener('mousedown', e => e.stopPropagation());
    li.addEventListener('input', e => { ev.text = e.target.value; });
    lw.appendChild(li);
    tlContent.appendChild(lw);

    // Drop line (bottom half of timeline row)
    const dl = document.createElement('div');
    dl.className = 'ev-drop-line';
    dl.style.left = `${ev.x}px`;
    tlContent.appendChild(dl);
  }
}

// ── Section drop lines ────────────────────────────
function makeSecLine(ev) {
  const ln = document.createElement('div');
  ln.className = 'sec-drop-line';
  ln.style.left = `${ev.x}px`;
  ln.dataset.evId = ev.id;
  return ln;
}

function refreshSecDropLines(secContent) {
  secContent.querySelectorAll('.sec-drop-line').forEach(el => el.remove());
  for (const ev of events) secContent.appendChild(makeSecLine(ev));
}

// ── Render section ────────────────────────────────
function renderSection(sec) {
  const row = document.createElement('div');
  row.className = 'row sec-row';
  row.id = `sec-row-${sec.id}`;

  // Label cell
  const lbl = document.createElement('div');
  lbl.className = 'row-label';
  const ni = document.createElement('input');
  ni.type = 'text'; ni.className = 'sec-name-input';
  ni.value = sec.name; ni.placeholder = 'セクション名';
  ni.addEventListener('input', e => { sec.name = e.target.value; });
  lbl.appendChild(ni);
  row.appendChild(lbl);

  // Content cell
  const sc = document.createElement('div');
  sc.className = 'row-content';
  sc.id = `sc-${sec.id}`;

  // Drop lines from existing events
  for (const ev of events) sc.appendChild(makeSecLine(ev));

  // Existing tasks
  for (const t of sec.tasks) appendTask(sc, sec, t);

  // Single tap/click on empty area → add a task.
  // Ignore if the pointer moved (scroll drag): track down position and
  // only fire when total travel is within TAP_MAX pixels.
  const TAP_MAX = 8;
  let tapDown = null;
  sc.addEventListener('pointerdown', e => {
    if (e.target !== sc && !e.target.classList.contains('sec-drop-line')) return;
    tapDown = { x: e.clientX, y: e.clientY };
  });
  sc.addEventListener('pointermove', e => {
    if (!tapDown) return;
    if (Math.abs(e.clientX - tapDown.x) > TAP_MAX ||
        Math.abs(e.clientY - tapDown.y) > TAP_MAX) {
      tapDown = null; // moved too far → not a tap
    }
  });
  sc.addEventListener('pointerup', e => {
    if (!tapDown) return;
    tapDown = null;
    if (e.target !== sc && !e.target.classList.contains('sec-drop-line')) return;
    const rect = sc.getBoundingClientRect();
    addTask(sec.id, e.clientX - rect.left);
  });
  sc.addEventListener('pointercancel', () => { tapDown = null; });

  row.appendChild(sc);
  scrollWrap.insertBefore(row, addSecRow);
  return ni;
}

// ── Task element ──────────────────────────────────
function appendTask(container, sec, task) {
  const bar = document.createElement('div');
  bar.className = 'task-bar';
  bar.id = `task-${task.id}`;
  bar.style.left  = `${task.x}px`;
  bar.style.width = `${task.w}px`;

  const lh = document.createElement('div'); lh.className = 't-handle tl'; lh.innerHTML = '⋮';
  const ti = document.createElement('input');
  ti.type = 'text'; ti.className = 'task-text'; ti.value = task.text; ti.placeholder = 'タスク名';
  ti.addEventListener('input', e => { task.text = e.target.value; });
  const rh = document.createElement('div'); rh.className = 't-handle tr'; rh.innerHTML = '⋮';

  bar.appendChild(lh); bar.appendChild(ti); bar.appendChild(rh);
  container.appendChild(bar);

  bar.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    showCtx(e.clientX, e.clientY, [{ label: 'タスクを削除', fn: () => deleteTask(sec.id, task.id) }]);
  });

  setupDrag(bar, sec, task, lh, rh);
  return bar;
}

// ── Drag / resize (Pointer Events: mouse + touch + pen) ──
const DRAG_THRESH = 6; // px before a press becomes a drag

function setupDrag(bar, sec, task, lh, rh) {
  bar.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return; // left button only
    const isHandle = (e.target === lh || e.target === rh);
    const mode  = e.target === lh ? 'l' : e.target === rh ? 'r' : 'move';
    const input = bar.querySelector('.task-text');
    const sx = e.clientX, st = { x: task.x, w: task.w };
    let started   = isHandle;   // handles begin dragging immediately
    let menuShown = false;
    let lpTimer   = null;

    bar.setPointerCapture(e.pointerId);
    e.preventDefault(); // prevent text-selection and callout on long-press (all pointer types)
    if (isHandle) bar.classList.add('dragging');

    // Touch long-press on the body → delete menu
    if (e.pointerType === 'touch' && !isHandle) {
      lpTimer = setTimeout(() => {
        lpTimer = null; menuShown = true;
        try { bar.releasePointerCapture(e.pointerId); } catch (_) {}
        showCtx(e.clientX, e.clientY,
          [{ label: 'タスクを削除', fn: () => deleteTask(sec.id, task.id) }]);
      }, 500);
    }

    const onMove = ev => {
      const dx = ev.clientX - sx;
      if (lpTimer && Math.abs(dx) > DRAG_THRESH) { clearTimeout(lpTimer); lpTimer = null; }
      if (menuShown) return;
      if (!started) {
        if (Math.abs(dx) < DRAG_THRESH) return;
        started = true;
        bar.classList.add('dragging');
        if (document.activeElement) document.activeElement.blur();
      }
      ev.preventDefault();

      if (mode === 'move') {
        const raw = Math.max(0, st.x + dx);
        const sl = snapTo(raw), sr = snapTo(raw + task.w);
        if (sl !== null)      { task.x = sl;            bar.classList.add('snapping'); }
        else if (sr !== null) { task.x = sr - task.w;  bar.classList.add('snapping'); }
        else                  { task.x = raw;          bar.classList.remove('snapping'); }
        bar.style.left = `${task.x}px`;
      } else if (mode === 'r') {
        let w = Math.max(50, st.w + dx);
        const sr = snapTo(st.x + w);
        if (sr !== null) { w = Math.max(50, sr - st.x); bar.classList.add('snapping'); }
        else             { bar.classList.remove('snapping'); }
        task.w = w; bar.style.width = `${w}px`;
      } else { // 'l'
        let nw = Math.max(50, st.w - dx);
        let nx = Math.max(0, st.x + st.w - nw);
        const sl = snapTo(nx);
        if (sl !== null) { nx = sl; nw = st.x + st.w - nx; bar.classList.add('snapping'); }
        else             { bar.classList.remove('snapping'); }
        task.x = nx; task.w = nw;
        bar.style.left = `${nx}px`; bar.style.width = `${nw}px`;
      }
      updateTaskMarkers(bar, task); // live marker update while dragging
    };

    const onUp = ev => {
      if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
      try { bar.releasePointerCapture(ev.pointerId); } catch (_) {}
      bar.removeEventListener('pointermove', onMove);
      bar.removeEventListener('pointerup', onUp);
      bar.removeEventListener('pointercancel', onUp);
      bar.classList.remove('dragging', 'snapping');
      updateTaskMarkers(bar, task);
      // A press without movement (and no menu) is a tap → edit the text
      if (!started && !menuShown && input) input.focus();
    };

    bar.addEventListener('pointermove', onMove);
    bar.addEventListener('pointerup', onUp);
    bar.addEventListener('pointercancel', onUp);
  });
}

// ── Actions ───────────────────────────────────────
function addEvent(x) {
  const ev = { id: uid(), x, text: '' };
  events.push(ev);
  renderEvents();
  // Add drop lines to all sections
  for (const sec of sections) {
    const sc = document.getElementById(`sc-${sec.id}`);
    if (sc) sc.appendChild(makeSecLine(ev));
  }
  updateAllTaskMarkers();
  requestAnimationFrame(() => {
    const inp = document.querySelector(`[data-ev="${ev.id}"]`);
    if (inp) inp.focus();
  });
}

function deleteEvent(id) {
  const i = events.findIndex(e => e.id === id);
  if (i < 0) return;
  events.splice(i, 1);
  renderEvents();
  for (const sec of sections) {
    const sc = document.getElementById(`sc-${sec.id}`);
    if (sc) refreshSecDropLines(sc);
  }
  updateAllTaskMarkers();
}

function addSection() {
  const sec = { id: uid(), name: '', tasks: [] };
  sections.push(sec);
  const ni = renderSection(sec);
  requestAnimationFrame(() => ni.focus());
}

function addTask(secId, clickX) {
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  let x;
  if (clickX != null) {
    // Center the new bar on the double-click point, then snap edges to events
    x = Math.max(0, clickX - TASK_W_DEF / 2);
    const sl = snapTo(x);
    const sr = snapTo(x + TASK_W_DEF);
    if (sl !== null) x = sl;
    else if (sr !== null) x = sr - TASK_W_DEF;
  } else {
    const last = sec.tasks[sec.tasks.length - 1];
    x = last ? last.x + last.w + 12 : 20;
  }
  const task = { id: uid(), x, w: TASK_W_DEF, text: '' };
  sec.tasks.push(task);
  const sc = document.getElementById(`sc-${secId}`);
  if (!sc) return;
  const bar = appendTask(sc, sec, task);
  updateTaskMarkers(bar, task);
  requestAnimationFrame(() => {
    const inp = document.querySelector(`#task-${task.id} input`);
    if (inp) inp.focus();
  });
}

function deleteTask(secId, taskId) {
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  const i = sec.tasks.findIndex(t => t.id === taskId);
  if (i >= 0) sec.tasks.splice(i, 1);
  const el = document.getElementById(`task-${taskId}`);
  if (el) el.remove();
}

// ── Timeline click ────────────────────────────────
tlContent.addEventListener('click', e => {
  if (e.target !== tlContent && !e.target.matches('#timeline-line')) return;
  const rect = tlContent.getBoundingClientRect();
  addEvent(e.clientX - rect.left);
});

// ── Init ──────────────────────────────────────────
document.getElementById('btn-add-sec').addEventListener('click', addSection);
addSection(); // start with one section
</script>
